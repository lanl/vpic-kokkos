name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

# Each job runs on its own runner, so the two builds proceed in parallel and
# never compete for cores. Builds use every core the runner has.
#
# The runner image is pinned so that the MPI version (Open MPI 5 on Ubuntu
# 26.04) does not change under the tests; move to a newer image deliberately.
#
# The runner has fewer cores than the largest tests have ranks (up to 27).
# The tests pass --oversubscribe when they detect Open MPI; this variable lets
# Open MPI 5 (PRRTE) oversubscribe even if that detection fails.
env:
  PRTE_MCA_rmaps_default_mapping_policy: ":oversubscribe"

jobs:
  # VPIC builds its own Kokkos from the submodule, as the arch/ scripts do
  internal-kokkos:
    runs-on: ubuntu-26.04

    steps:
    - name: Install deps
      run: |
        sudo apt-get update; sudo apt-get install gfortran openmpi-bin libopenmpi-dev
        dpkg-query -W openmpi-bin; nproc; lscpu | grep -E "^(Core|Thread)"
    - name: Checkout vpic and kokkos
      uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_INTERNAL_KOKKOS=ON -DENABLE_TESTS=ON -DCMAKE_CXX_FLAGS="-rdynamic -fno-strict-aliasing"
    - name: make
      run: cmake --build build --parallel $(nproc)
    - name: make check
      run: ctest --output-on-failure -j 2
      working-directory: build

  # The same Kokkos submodule, installed separately and found with
  # find_package, to cover that path and the 2-stage compile against it
  external-kokkos:
    runs-on: ubuntu-26.04

    steps:
    - name: Install deps
      run: |
        sudo apt-get update; sudo apt-get install gfortran openmpi-bin libopenmpi-dev
        dpkg-query -W openmpi-bin; nproc; lscpu | grep -E "^(Core|Thread)"
    - name: Checkout vpic and kokkos
      uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Build kokkos
      working-directory: kokkos
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$HOME/kokkos -DCMAKE_CXX_STANDARD=20 -DKokkos_ENABLE_OPENMP=ON
        cmake --build build --parallel $(nproc)
        cmake --install build
    - name: configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$HOME/kokkos" -DENABLE_TESTS=ON -DCMAKE_CXX_FLAGS="-rdynamic -fno-strict-aliasing"
    - name: make
      run: cmake --build build --parallel $(nproc)
    - name: make check
      run: ctest --output-on-failure -j 2
      working-directory: build
